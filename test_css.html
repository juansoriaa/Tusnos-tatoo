<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; overflow: hidden; }
  .carousel-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
  }
  .animate-scroll-bg {
    display: flex;
    width: 200%;
    height: 100%;
    animation: scroll-bg 5s linear infinite;
  }
  .carousel-img {
    width: 25%;
    height: 100vh;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid red;
    box-sizing: border-box;
  }
  .mobile-only {
    display: none;
  }
  @media (max-width: 768px) {
    .animate-scroll-bg {
      width: 400%;
      flex-wrap: wrap;
    }
    .carousel-img {
      width: 12.5%; /* 1/8 of 400% = 50vw */
      height: 50vh;
    }
    .mobile-only {
      display: block;
    }
  }
  @keyframes scroll-bg {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>
<body>
  <div class="carousel-container">
    <div class="animate-scroll-bg">
      <div class="carousel-img">1</div>
      <div class="carousel-img">2</div>
      <div class="carousel-img">3</div>
      <div class="carousel-img">4</div>
      <div class="carousel-img">1</div>
      <div class="carousel-img">2</div>
      <div class="carousel-img">3</div>
      <div class="carousel-img">4</div>
      <div class="carousel-img mobile-only">1</div>
      <div class="carousel-img mobile-only">2</div>
      <div class="carousel-img mobile-only">3</div>
      <div class="carousel-img mobile-only">4</div>
      <div class="carousel-img mobile-only">1</div>
      <div class="carousel-img mobile-only">2</div>
      <div class="carousel-img mobile-only">3</div>
      <div class="carousel-img mobile-only">4</div>
    </div>
  </div>
</body>
</html>
