<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Silence MetaMask and Web3 extension errors generated by the user's browser/environment in the sandboxed iframe
      window.addEventListener('error', function(e) {
        if (e.message && (
          e.message.toLowerCase().includes('metamask') ||
          e.message.toLowerCase().includes('ethereum') ||
          e.message.toLowerCase().includes('rpc')
        )) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        const reasonStr = e.reason ? (e.reason.message || String(e.reason)) : '';
        if (reasonStr && (
          reasonStr.toLowerCase().includes('metamask') ||
          reasonStr.toLowerCase().includes('ethereum') ||
          reasonStr.toLowerCase().includes('rpc')
        )) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turnos Tattoo v2</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Montserrat:wght@100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
